[theme]
# Color de fondo central (Blanco puro, limpio y moderno)
backgroundColor = "#FFFFFF"

# Color de la barra lateral (Azul marino académico profundo)
secondaryBackgroundColor = "#0F172A"

# Color del texto principal (Gris oscuro de alta legibilidad)
textColor = "#1E293B"

# Color de los botones y elementos activos (Azul cobalto institucional)
primaryColor = "#1D4ED8"

# Tipografía (Sans-Serif geométrica, moderna y corporativa)
font = "sans serif"
